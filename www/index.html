<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Bíblia de Estudo — leitura completa da Bíblia (ACF), Bíblia em áudio, orações guiadas e quiz bíblico.">
<meta name="theme-color" content="#0f1729">
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bíblia">
<title>Bíblia de Estudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="phone-frame" id="phoneFrame">
<header class="app-header">
    <h1 id="headerTitle">Bíblia de Estudo</h1>
    <div class="header-actions" id="headerActions"></div>
  </header>

  <main class="app-content" id="appContent" aria-live="polite"></main>

  <div class="toast" id="toast" role="status"></div>

  <nav class="bottom-nav compact-menu" aria-label="Navegação principal">
    <button class="menu-toggle" id="bottomMenuToggle" type="button" aria-label="Abrir menu" aria-expanded="false">
      <span class="menu-toggle-icon">
      <svg class="menu-four-squares" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="4" y="4" width="12" height="12" rx="3"></rect>
        <rect x="20" y="4" width="12" height="12" rx="3"></rect>
        <rect x="4" y="20" width="12" height="12" rx="3"></rect>
        <rect x="20" y="20" width="12" height="12" rx="3"></rect>
      </svg>
    </span>
    </button>

    <div class="bottom-menu-items">
      <button class="nav-item" data-nav-key="home" data-route="/">
        <span class="nav-icon"></span><span>Início</span>
      </button>
      <button class="nav-item" data-nav-key="bible" data-route="/biblia">
        <span class="nav-icon"></span><span>Bíblia</span>
      </button>
      <button class="nav-item" data-nav-key="prayer" data-route="/oracao">
        <span class="nav-icon"></span><span>Oração</span>
      </button>
      <button class="nav-item" data-nav-key="profile" data-route="/perfil">
        <span class="nav-icon"></span><span>Perfil</span>
      </button>
      <button class="nav-item" data-nav-key="assistant" data-route="/assistente">
        <span class="nav-icon">✨</span><span>Assistente</span>
      </button>
      <button class="nav-item" data-nav-key="settings" data-route="/configuracoes">
        <span class="nav-icon"></span><span>Ajustes</span>
      </button>
    </div>
  </nav>

  <div class="home-indicator"></div>
</div>

<script>
(function () {
  var emDesenvolvimento = location.hostname === 'localhost' && location.port === '3000';
  var jaMostrado = false;

  window.addEventListener('error', function (e) {
    var detalhes = (e.message || 'erro desconhecido') +
      '\narquivo: ' + (e.filename || '?') + '\nlinha: ' + (e.lineno || '?');
    try { console.error('[erro]', detalhes); } catch (_e) { /* ignora */ }

    if (emDesenvolvimento) {
      alert('ERRO JS: ' + e.message + '\narquivo: ' + e.filename + '\nlinha: ' + e.lineno);
      return;
    }
    if (jaMostrado || !document.body) return;
    if (e.message === 'Script error.' && !e.lineno) return;
    jaMostrado = true;

    var caixa = document.createElement('div');
    caixa.setAttribute('role', 'alert');
    caixa.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top, 0px));z-index:10000;padding:12px 14px;background:#1a2644;color:#f4efe3;border:1px solid #c9a96e;border-radius:14px;font:14px/1.4 Inter,Arial,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4);';

    var texto = document.createElement('div');
    texto.textContent = 'Algo deu errado. Se a tela não carregar, feche e abra o app de novo.';

    function botao(rotulo, principal) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = rotulo;
      b.style.cssText = 'border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;' +
        (principal ? 'background:#c9a96e;color:#1a1a1a;' : 'background:rgba(244,239,227,.12);color:inherit;');
      return b;
    }
    var recarregar = botao('Recarregar', true);
    recarregar.addEventListener('click', function () { location.reload(); });
    var fechar = botao('Fechar', false);
    fechar.addEventListener('click', function () { caixa.remove(); });

    var acoes = document.createElement('div');
    acoes.style.cssText = 'display:flex;gap:8px;margin-top:10px;';
    acoes.appendChild(recarregar);
    acoes.appendChild(fechar);

    var det = document.createElement('details');
    det.style.cssText = 'margin-top:8px;opacity:.75;font-size:12px;';
    var resumo = document.createElement('summary');
    resumo.textContent = 'Detalhes para o suporte';
    var pre = document.createElement('pre');
    pre.style.cssText = 'white-space:pre-wrap;word-break:break-word;margin:6px 0 0;';
    pre.textContent = detalhes;
    det.appendChild(resumo);
    det.appendChild(pre);

    caixa.appendChild(texto);
    caixa.appendChild(acoes);
    caixa.appendChild(det);
    document.body.appendChild(caixa);
  });
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>setTimeout(function(){ throw new Error("teste de erro"); }, 3000);</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
