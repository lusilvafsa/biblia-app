name: Publicar no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R www/. _site/
            echo "=== VERIFICANDO ARQUIVOS SUPABASE ==="
            find _site/js/supabase -maxdepth 1 -type f -printf "%p %s bytes\n" | sort
            echo "=== FIM DA VERIFICAÇÃO ==="
          echo "=== TESTE DE ESTRUTURA JS ==="
          echo "--- arquivos diretamente em js ---"
          find _site/js -maxdepth 1 -type f -printf "%p %s bytes\\n" | sort
          echo "--- arquivos em subdiretórios de js ---"
          find _site/js -mindepth 2 -maxdepth 3 -type f -printf "%p %s bytes\\n" | sort | grep -E 'testfolder|supabase|features/bible' || true
          echo "=== FIM TESTE DE ESTRUTURA JS ==="

      - name: Empacotar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
